<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" role="img" aria-label="seal set: storing one secret">
<title>seal set: storing one secret</title>
<defs>
  <filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0a0b0e" flood-opacity="0.08"/></filter>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker>
  <marker id="are" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
</defs>
<rect width="900" height="672" rx="16" fill="#fcfcfd" stroke="#e4e4e7" stroke-width="1"/>
<rect x="300" y="24" width="300" height="54" rx="27" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" filter="url(#sh)"/>
<text x="450.0" y="48" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">seal set GITHUB_TOKEN</text>
<text x="450.0" y="66" fill="#b45309" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PLAINTEXT · TYPED BY YOU</text>
<path d="M450,80 L450,112" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="40" y="116" width="820" height="444" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" filter="url(#sh)"/>
<text x="68" y="150" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" text-anchor="start">seal set</text>
<text x="832" y="150" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="end">umask 077 · refuses bash -x</text>
<rect x="64" y="172" width="772" height="72" rx="10" fill="#f4f4f6" stroke="#e4e4e7" stroke-width="1"/>
<circle cx="94" cy="208" r="14" fill="#fcfcfd" stroke="#e4e4e7" stroke-width="1"/>
<text x="94" y="213" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">1</text>
<text x="124" y="213" fill="#18181b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="600" text-anchor="start">key name</text>
<text x="262" y="203" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" text-anchor="start">[A-Za-z_][A-Za-z0-9_]*</text>
<text x="262" y="225" fill="#71717a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" text-anchor="start">it becomes an environment variable name</text>
<path d="M94,244 L94,258" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="64" y="260" width="772" height="72" rx="10" fill="#f4f4f6" stroke="#e4e4e7" stroke-width="1"/>
<circle cx="94" cy="296" r="14" fill="#fcfcfd" stroke="#e4e4e7" stroke-width="1"/>
<text x="94" y="301" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text x="124" y="301" fill="#18181b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="600" text-anchor="start">hidden prompt</text>
<text x="262" y="291" fill="#18181b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400" text-anchor="start">read -s from the terminal, asked twice</text>
<text x="262" y="313" fill="#71717a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" text-anchor="start">must match and not be empty  ·  or piped / --stdin: whole stdin</text>
<path d="M94,332 L94,346" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="64" y="348" width="772" height="72" rx="10" fill="#f4f4f6" stroke="#e4e4e7" stroke-width="1"/>
<circle cx="94" cy="384" r="14" fill="#fcfcfd" stroke="#e4e4e7" stroke-width="1"/>
<text x="94" y="389" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text x="124" y="389" fill="#18181b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="600" text-anchor="start">first set only</text>
<text x="262" y="379" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" text-anchor="start">recipients: SEAL_RECIPIENTS or ~/.config/sops/age/pubs.txt</text>
<text x="262" y="401" fill="#71717a" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" text-anchor="start">creates the empty ledger: temp file, 0600, mv into place</text>
<path d="M94,420 L94,434" stroke="#a1a1aa" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="64" y="436" width="772" height="72" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
<circle cx="94" cy="472" r="14" fill="#fcfcfd" stroke="#6ee7b7" stroke-width="1"/>
<text x="94" y="477" fill="#047857" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">4</text>
<text x="124" y="477" fill="#18181b" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="600" text-anchor="start">store</text>
<text x="262" y="467" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" text-anchor="start">printf %s | jq -Rs . | sops set --value-stdin LEDGER '["KEY"]'</text>
<text x="262" y="489" fill="#047857" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="400" text-anchor="start">value travels by pipe  ·  then chmod 0600</text>
<text x="64" y="544" fill="#047857" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" text-anchor="start">the value is never in argv, never on disk in clear, never echoed</text>
<path d="M450,560 L450,590" stroke="#047857" stroke-width="1.5" fill="none" marker-end="url(#are)"/>
<rect x="220" y="594" width="460" height="54" rx="27" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" filter="url(#sh)"/>
<text x="450.0" y="618" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" text-anchor="middle">~/.local/share/seal/secrets.enc.yaml</text>
<text x="450.0" y="636" fill="#047857" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LEDGER · CIPHERTEXT · 0600</text>
</svg>
