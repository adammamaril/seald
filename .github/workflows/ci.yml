name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install age, jq, sops, shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y age jq shellcheck
          curl -fsSLo sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo install -m 0755 sops /usr/local/bin/sops && rm sops
      - name: Lint
        run: shellcheck seal
      - name: Test
        run: make test
      - name: Install and run from PATH
        run: |
          make install PREFIX="$HOME/.local"
          SEAL_CLI="$HOME/.local/bin/seal" python3 -m unittest discover -s tests
