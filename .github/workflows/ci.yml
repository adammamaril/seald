name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (dogfoods scripts/install-deps.sh)
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./scripts/install-deps.sh
          sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck seal scripts/install-deps.sh
      - name: Test
        run: make test
      - name: Install and run from PATH
        run: |
          make install PREFIX="$HOME/.local"
          SEAL_CLI="$HOME/.local/bin/seal" python3 -m unittest discover -s tests
