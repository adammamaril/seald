[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seald"
dynamic = ["version"]
description = "A tiny age-encrypted secret store."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Genga Labs" }]
maintainers = [{ name = "Genga Labs" }]
keywords = ["age", "encryption", "secrets", "cli"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/adammamaril/seald"
Issues = "https://github.com/adammamaril/seald/issues"

[project.scripts]
seald = "seald.cli:main"

[tool.hatch.version]
path = "src/seald/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seald"]

[tool.hatch.build.targets.sdist]
include = ["src/seald", "tests", "LICENSE", "README.md", "seald"]
